services:
  - type: web
    name: dekker-group
    runtime: node
    # Lint before anything is built. Errors are reserved for code that is
    # actually broken — an undefined variable, a misused hook — so a failure
    # here means the deploy would have shipped a fault. Warnings do not fail
    # the build.
    buildCommand: npm install && npm run lint && cd client && npm install && npm run build && cd .. && cd server && npm install && cd ..
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        fromService:
          type: web
          name: dekker-group
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: dekker-group-db
          property: connectionString

databases:
  - name: dekker-group-db
    databaseName: dekker_group
    user: dekker
    plan: free
