services:
  - type: web
    name: dekker-group
    runtime: node
    # Lint before anything is built. Errors are reserved for code that is
    # actually broken — an undefined variable, a misused hook — so a failure
    # here means the deploy would have shipped a fault. Warnings do not fail
    # the build.
    buildCommand: npm install && npm run lint && cd client && npm install && npm run build && cd .. && cd server && npm install && cd ..
    # The heap cap is worked out from the instance's own memory limit rather
    # than written down, so changing plan needs no change here and the number
    # cannot be left pointing at a size that used to be true. Left alone, V8
    # sizes its heap from the host's memory, never feels pressure inside a much
    # smaller container, and gets killed for exceeding the limit — which signs
    # out everyone who was using the app. See server/src/heap-budget.js.
    startCommand: node $(node server/src/heap-budget.js) server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        fromService:
          type: web
          name: dekker-group
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: dekker-group-db
          property: connectionString

databases:
  - name: dekker-group-db
    databaseName: dekker_group
    user: dekker
    plan: free
